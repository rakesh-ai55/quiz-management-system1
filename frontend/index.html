<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Management System - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="auth-container">
      <div class="text-center mb-20">
        <h1 style="color:#fff; font-size:2rem;">Quiz Management System</h1>
        <p style="color:#eee;">Test your knowledge and track your progress</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="showTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="showTab('register')">Register</button>
      </div>
      <div id="alert-box"></div>
      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
        <h2>Welcome Back</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
      </form>
      <form class="auth-form hidden" id="register-form" onsubmit="handleRegister(event)">
        <h2>Create Account</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" required placeholder="Enter your full name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Min 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
