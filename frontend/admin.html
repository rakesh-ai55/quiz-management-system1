<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Quiz Management System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">QuizSystem Admin</div>
    <div class="nav-links">
      <a href="admin.html">Admin Panel</a>
      <a href="dashboard.html">User Dashboard</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container">
    <div id="alert-box"></div>
    <div class="card">
      <h2>Manage Quizzes</h2>
      <button class="btn btn-success btn-sm" onclick="openQuizModal()">+ Create Quiz</button>
      <div class="quiz-grid" id="admin-quiz-list" style="margin-top:15px;">Loading...</div>
    </div>
    <div class="card">
      <h2>All Users</h2>
      <div id="admin-users">Loading...</div>
    </div>
    <div class="card">
      <h2>All Results</h2>
      <div id="admin-results">Loading...</div>
    </div>
  </div>

  <!-- Quiz Modal -->
  <div id="quiz-modal" class="card hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:500px; z-index:200; max-height:90vh; overflow:auto;">
    <h3 id="modal-title">Create Quiz</h3>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="qm-title" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="qm-desc" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Time Limit (minutes)</label>
      <input type="number" id="qm-time" value="10" min="1" />
    </div>
    <div class="mt-20">
      <button class="btn btn-primary" onclick="saveQuiz()">Save</button>
      <button class="btn btn-danger" onclick="closeQuizModal()">Cancel</button>
    </div>
  </div>

  <!-- Question Modal -->
  <div id="question-modal" class="card hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:500px; z-index:200; max-height:90vh; overflow:auto;">
    <h3 id="qmodal-title">Add Question</h3>
    <input type="hidden" id="qq-quiz-id" />
    <input type="hidden" id="qq-id" />
    <div class="form-group">
      <label>Question Text</label>
      <input type="text" id="qq-text" />
    </div>
    <div class="form-group">
      <label>Option 1</label>
      <input type="text" id="qq-opt0" />
    </div>
    <div class="form-group">
      <label>Option 2</label>
      <input type="text" id="qq-opt1" />
    </div>
    <div class="form-group">
      <label>Option 3</label>
      <input type="text" id="qq-opt2" />
    </div>
    <div class="form-group">
      <label>Option 4</label>
      <input type="text" id="qq-opt3" />
    </div>
    <div class="form-group">
      <label>Correct Answer (0-3)</label>
      <input type="number" id="qq-ans" min="0" max="3" value="0" />
    </div>
    <div class="form-group">
      <label>Marks</label>
      <input type="number" id="qq-marks" value="1" min="1" />
    </div>
    <div class="mt-20">
      <button class="btn btn-primary" onclick="saveQuestion()">Save</button>
      <button class="btn btn-danger" onclick="closeQuestionModal()">Cancel</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
