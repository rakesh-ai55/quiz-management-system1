<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz - Quiz Management System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">QuizSystem</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="timer hidden" id="timer">Time Left: 00:00</div>
  <div class="container">
    <div id="alert-box"></div>
    <div class="card" id="quiz-container">
      <h2 id="quiz-title">Loading...</h2>
      <p id="quiz-desc"></p>
      <div id="questions-area"></div>
      <div class="mt-20">
        <button class="btn btn-success" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Quiz</button>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
